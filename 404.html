<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · Cody</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfbfa">
<link rel="icon" href="/img/favicon.ico">
<style>
  :root{ --bg:#fbfbfa; --fg:#1a1a1c; --muted:#6f7076; --line:#e7e6e3; --accent:#2b5fd9; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111113; --fg:#ededf0; --muted:#8e8f96; --line:#2a2a2f; --accent:#8fb0ff; }
  }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:var(--bg); color:var(--fg);
        font:16px/1.85 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
             "Hiragino Sans GB","Microsoft YaHei",sans-serif;
        -webkit-font-smoothing:antialiased; padding:24px }
  .box{ text-align:center; max-width:420px }
  .code{ font-size:64px; font-weight:640; letter-spacing:-.04em; margin:0; line-height:1;
         color:var(--fg); font-variant-numeric:tabular-nums }
  p{ margin:16px 0 0; color:var(--muted) }
  a{ color:var(--accent); text-decoration:none; border-bottom:1px solid transparent }
  a:hover{ border-bottom-color:currentColor }
  .links{ margin-top:26px; padding-top:20px; border-top:1px solid var(--line);
          font-size:14.5px; display:flex; gap:18px; justify-content:center }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <p>这个页面不存在，或者已经被移走了。</p>
    <div class="links">
      <a href="/">返回首页</a>
      <a href="/post/">文章存档</a>
    </div>
  </div>
</body>
</html>
