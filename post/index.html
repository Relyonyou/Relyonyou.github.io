  *{box-sizing:border-box}

  footer{max-width:720px;margin:0 auto;padding:22px 24px 48px;
         border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  @media (max-width:600px){
    .topbar{padding:16px 20px 0} main{padding:28px 20px 40px}
    h1{font-size:25px}
    .entry{flex-direction:column;gap:2px} .entry time{width:auto;font-size:13px}
